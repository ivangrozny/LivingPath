name: Build LivingPath (macOS Intel) + appTest

# À placer dans .github/workflows/build-livingpath-macos-intel.yml
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15-intel  # runner Intel (x86_64), dernier runner Intel de GitHub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Sur un runner macOS 15, pip choisit les wheels numpy/scipy "macosx_14_0"
      # (Accelerate), qui plantent sur les Mac sous macOS < 14 ("Symbol not found
      # _cblas_...$NEWLAPACK"). On force donc les wheels compatibles macOS 13.
      - name: Installer numpy/scipy compatibles macOS 13
        run: |
          python -m pip install --upgrade pip
          python -m pip download "numpy<2.2" "scipy==1.15.1" --no-deps --only-binary=:all: \
            --platform macosx_13_0_x86_64 --python-version 3.12 --implementation cp --abi cp312 -d wheels
          python -m pip install wheels/*.whl

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # numba (couche OpenMP) a besoin de libomp.dylib, absent des wheels PyPI.
      # On l'installe via Homebrew et on indique son dossier à PyInstaller.
      - name: Installer libomp
        run: |
          brew install libomp
          echo "DYLD_LIBRARY_PATH=$(brew --prefix libomp)/lib" >> "$GITHUB_ENV"

      # Le .spec du dépôt contient déjà toute la config (datas, hooks,
      # collect_all hyperglot, icône, .app) : on ne passe aucune autre option.
      - name: Build PyInstaller
        run: python -m PyInstaller --noconfirm --clean LivingPath.spec

      - name: Vérifier l'architecture
        run: |
          ls dist
          find dist/LivingPath.app -name 'libomp*' || true   # doit lister libomp.dylib
          lipo -archs dist/LivingPath.app/Contents/MacOS/LivingPath   # attendu : x86_64

      # Test de lancement : l'app doit rester ouverte 20 s sans planter.
      # Toute la sortie console (erreurs d'import, tracebacks...) va dans app.log.
      - name: Test de lancement
        continue-on-error: true   # un échec n'empêche pas de récupérer l'app
        run: |
          set +e
          ./dist/LivingPath.app/Contents/MacOS/LivingPath > app.log 2>&1 &
          PID=$!
          sleep 120
          if kill -0 $PID 2>/dev/null; then
            echo "OK : l'app tourne toujours après 120 s"
            kill $PID
            RESULT=0
          else
            wait $PID
            RESULT=$?
            echo "ECHEC : l'app s'est arrêtée (code $RESULT)"
          fi
          echo "----- sortie console -----"
          cat app.log
          exit $RESULT

      - name: Sauvegarder le log du test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LivingPath-test-log
          path: app.log
          if-no-files-found: ignore

      # ditto préserve la structure du .app (un zip classique peut la casser)
      - name: Compresser le .app
        run: ditto -c -k --keepParent dist/LivingPath.app LivingPath-macos-intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LivingPath-macos-intel
          path: LivingPath-macos-intel.zip
